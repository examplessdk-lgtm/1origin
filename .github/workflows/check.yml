name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: node --test backend/github-app.test.cjs
      - run: node --experimental-strip-types --test ui/nuxt/test/github-import.test.mjs
      - run: python scripts/render-github-infrastructure.py && git diff --exit-code -- infra/aws/github-app-import.cloudformation.json
      - run: npm ci --prefix ui/nuxt --no-audit --no-fund
      - run: npm run typecheck --prefix ui/nuxt
      - run: npm run generate --prefix ui/nuxt
      - run: python scripts/render-infrastructure.py && git diff --exit-code -- infrastructure/control-plane.json
